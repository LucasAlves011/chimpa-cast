services:
  # Serviço da Aplicação Spring Boot ChimpaCast (Produção)
  prd-app-chimpacast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimpacast_app_prd
    restart: unless-stopped
    networks:
      - prd-chimpacast-network
    ports:
      - "${PORT:-8084}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prd}
      - APP_ADMIN_KEY=${APP_ADMIN_KEY}
      - APP_SESSION_SECRET=${APP_SESSION_SECRET}
      - APP_SESSION_TTL_DAYS=${APP_SESSION_TTL_DAYS:-60}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - CLOUDFLARE_CALLS_APP_ID=${CLOUDFLARE_CALLS_APP_ID}
      - CLOUDFLARE_CALLS_APP_SECRET=${CLOUDFLARE_CALLS_APP_SECRET}
      - CLOUDFLARE_CALLS_ACCOUNT_ID=${CLOUDFLARE_CALLS_ACCOUNT_ID}
      - CLOUDFLARE_CALLS_ANALYTICS_TOKEN=${CLOUDFLARE_CALLS_ANALYTICS_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      - DISCORD_REQUIRED_ROLE_ID=${DISCORD_REQUIRED_ROLE_ID:-}
      - DISCORD_PUBLIC_URL=${DISCORD_PUBLIC_URL:-}
      - DISCORD_NOTIFY_COOLDOWN_SECONDS=${DISCORD_NOTIFY_COOLDOWN_SECONDS:-600}
      - DISCORD_NOTIFY_MENTION_VOICE=${DISCORD_NOTIFY_MENTION_VOICE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Sao_Paulo
      - TZ=America/Sao_Paulo

networks:
  prd-chimpacast-network:
    external: true
