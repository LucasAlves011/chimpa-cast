# Importa configuracoes locais se existirem (ignorado pelo git)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Porta do servidor local
server.port=8080

# Chave secreta de administracao (para resets e operacoes restritas)
app.admin-key=${APP_ADMIN_KEY:admin_super_secret_9981}

# Segredo que assina as sessoes (use um valor longo e aleatorio; trocar desloga todo mundo)
app.session-secret=${APP_SESSION_SECRET:}
# Duracao da sessao em dias
app.session-ttl-days=${APP_SESSION_TTL_DAYS:60}

# Configuracao de CORS centralizada (origens permitidas separadas por virgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Limites de Seguranca Anti-Cobranca da Cota Free (em bytes)
quota.hard-limit-bytes=990000000000
quota.warning-limit-bytes=900000000000

# Credenciais do Cloudflare Calls (configuradas via variaveis de ambiente ou application-local.properties)
cloudflare.calls.app-id=${CLOUDFLARE_CALLS_APP_ID:}
cloudflare.calls.app-secret=${CLOUDFLARE_CALLS_APP_SECRET:}
cloudflare.calls.account-id=${CLOUDFLARE_CALLS_ACCOUNT_ID:}
cloudflare.calls.analytics-token=${CLOUDFLARE_CALLS_ANALYTICS_TOKEN:}
cloudflare.calls.api-url=https://rtc.live.cloudflare.com/v1

# Nivel de logging
logging.level.com.screenshare=${LOG_LEVEL:INFO}

# Integracao com o Discord (cada recurso so e ativado quando configurado)
# Login (unica forma de entrar): exige client-id, client-secret, bot-token, guild-id e redirect-uri
# Aviso de live no canal: exige bot-token e channel-id
discord.client-id=${DISCORD_CLIENT_ID:}
discord.client-secret=${DISCORD_CLIENT_SECRET:}
discord.bot-token=${DISCORD_BOT_TOKEN:}
discord.guild-id=${DISCORD_GUILD_ID:}
discord.channel-id=${DISCORD_CHANNEL_ID:}
discord.redirect-uri=${DISCORD_REDIRECT_URI:}
# Opcional: exige um cargo especifico para entrar
discord.required-role-id=${DISCORD_REQUIRED_ROLE_ID:}
# Link do site mostrado no aviso (ex: https://chimpacast.seusite.com)
discord.public-url=${DISCORD_PUBLIC_URL:}
discord.notify-cooldown-seconds=${DISCORD_NOTIFY_COOLDOWN_SECONDS:600}
# Marca no aviso quem esta em canais de voz (exige guild-id; o bot conecta ao Gateway)
discord.notify-mention-voice=${DISCORD_NOTIFY_MENTION_VOICE:true}
